[package]
name = "niri-wallpaper"
version = "0.1.0"
edition = "2021"
description = "Dual-layer wallpaper daemon for niri: normal background + blurred overview backdrop in one process"
license = "MIT"

[dependencies]
# Wayland + layer-shell scaffolding.
smithay-client-toolkit = "0.20"
wayland-client = "0.31"

# Event loop.
calloop = "0.14"
calloop-wayland-source = "0.4"

# Image decode (jpg/png/webp — the formats 99% of wallpapers use).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# SIMD-accelerated resizing for the per-output cover-scale hot path.
fast_image_resize = "5"

# Filesystem watching.
inotify = "0.11"

# FFI: malloc_trim(0) on glibc to return freed heap pages to the OS after
# large decode/resize cycles (reclaims ~20-50 MB sustained RSS).
libc = "0.2"

# Config file.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Wallpaper rotation.
rand = "0.9"
croner = "3"
chrono = "0.4"

# Small utilities.
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
